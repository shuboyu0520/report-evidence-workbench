name: Application tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect archived evaluations with the Python standard library
        run: |
          python -I -S scripts/inspect_eval.py
          python -I -S scripts/inspect_eval.py --cohort booking --case B14
          python -I -S scripts/inspect_eval.py --cohort expedia --failed --json > "$RUNNER_TEMP/expedia-failures.json"
      - run: python -m pip install uv
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
