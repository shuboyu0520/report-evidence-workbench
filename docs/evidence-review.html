<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>财报问答逐题复核 · 财报复核工作台</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="evidence-review.css">
  <script defer src="evidence-review-data.js"></script>
  <script defer src="evidence-review.js"></script>
</head>
<body>
  <header>
    <nav aria-label="主导航">
      <a href="index.html">财报复核工作台</a>
      <a href="reader.html">财报阅读演示</a>
    </nav>
  </header>
  <main>
    <h1>财报问答逐题复核</h1>
    <p class="intro">对照评测时保存的答复和原文，打开官方 PDF 可直接核对引用所在页。</p>
    <p id="load-status" role="status">正在载入评测记录…</p>
    <noscript><p>请启用 JavaScript 以切换题目和查看引文。</p></noscript>
    <div id="review" hidden>
      <fieldset class="cohort-picker">
        <legend>评测批次</legend>
        <div class="cohort-buttons" id="cohort-buttons"></div>
      </fieldset>
      <div class="summary">
        <div><span>查数与指引通过数</span><strong id="lookup-score"></strong></div>
        <div><span>披露判断通过数</span><strong id="status-score"></strong></div>
      </div>
      <div class="controls">
        <label>筛选题目
          <select id="result-filter">
            <option value="all">全部题目</option>
            <option value="failed">只看未通过</option>
            <option value="changed">只看前后答案有变化</option>
          </select>
        </label>
        <label>按题号查看
          <select id="case-select"></select>
        </label>
        <div class="step-buttons" aria-label="顺序浏览">
          <button type="button" id="previous-case">上一题</button>
          <button type="button" id="next-case">下一题</button>
        </div>
      </div>
      <p id="navigation-status" role="status" aria-live="polite"></p>
      <article id="case-detail" aria-labelledby="question" hidden>
        <div class="case-meta">
          <div><span id="case-number"></span> · <span id="case-kind"></span> · <strong id="case-verdict"></strong></div>
          <div class="link-tools">
            <a id="permalink">本题固定链接</a>
            <button type="button" id="copy-link">复制链接</button>
          </div>
        </div>
        <p id="copy-status" class="copy-status" role="status" aria-live="polite"></p>
        <h2 id="question"></h2>
        <div id="answers"></div>
        <section aria-labelledby="grade-label" id="grade-section">
          <h3 id="grade-label">评分依据</h3>
          <p id="grade"></p>
          <p id="gold-pages" hidden></p>
          <details id="gold-excerpt" hidden>
            <summary>查看评分参考原文</summary>
            <blockquote id="gold-quote"></blockquote>
          </details>
        </section>
        <section aria-labelledby="sources-label">
          <h3 id="sources-label">答复附带的原文</h3>
          <div id="citations"></div>
        </section>
      </article>
    </div>
  </main>
</body>
</html>
